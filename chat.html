<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina | Academic OS</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <!-- Code Syntax Highlighting CSS Theme (Atom One Dark) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js for Code Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Optional: Add specific language support if needed -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
</head>

<body>
    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="brand">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg> Lumina
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="subjects.html" class="nav-link">Subjects</a></li>

                    <li><a href="generate-flashcard.html" class="nav-link">Flashcards</a></li>
                    <li><a href="chat.html" class="nav-link active">Lumina</a></li>
                    <li><a href="profile.html" class="nav-link">Profile</a></li>
                </ul>
            </nav>
            <div class="nav-controls">
                <button id="theme-toggle" class="icon-btn" onclick="themeManager.toggle()"></button>
            </div>
        </div>
    </header>

    <main style="max-width: 900px; margin: 0 auto; padding: var(--space-md);">
        <div class="chat-window">
            <!-- Header RAG Selector -->
            <div style="padding: var(--space-xs) var(--space-md); border-bottom: 1px solid var(--border-color); background-color: var(--bg-tertiary); display: flex; align-items: center; justify-content: space-between;">
                <div style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;">
                    RAG Context:
                </div>
                <select id="chat-subject-select" class="form-select" style="width: auto; padding: 6px 14px; font-size: 0.85rem; border-radius: var(--radius-full);">
                    <option value="">🌐 All Subjects (Global RAG Search)</option>
                </select>
            </div>

            <!-- Messages Area -->
            <div id="chat-messages" class="chat-messages">
                <div class="chat-bubble bot">
                    Hi there! I'm Lumina, Zhike Esguerra's learning assistant. Ask me anything or attach an image to get started!
                </div>
            </div>

            <!-- Multi-Image Preview Container -->
            <div id="image-preview-container" style="display: none; padding: 8px var(--space-md); background: var(--bg-tertiary); border-top: 1px solid var(--border-color); flex-wrap: wrap; gap: 8px; align-items: center;">
                <!-- Dynamic thumbnail badges render here -->
            </div>

            <!-- Input Bar -->
            <div class="chat-input-area" style="display: flex; gap: 8px; padding: var(--space-xs) var(--space-md); align-items: center;">
                <input type="file" id="chat-image-input" accept="image/*" multiple style="display: none;">
                <button id="attach-btn" type="button" class="btn" style="padding: 10px; border-radius: 50%;" title="Attach Images">
                    📎
                </button>
                <input type="text" id="chat-input" class="form-input" placeholder="Ask a question about your subject..." style="border-radius: var(--radius-full); flex: 1;">
                <button id="send-btn" class="btn btn-primary" style="padding: 12px 20px; border-radius: var(--radius-full);">
                    Send
                </button>
            </div>
        </div>
    </main>

    <script src="js/theme.js"></script>
    <script type="module" src="js/toast.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/animations.js"></script>
    <script type="module" src="js/subjects.js"></script>
    <script type="module" src="js/chat.js"></script>
</body>

</html>
