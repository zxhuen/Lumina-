<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Lumina</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <div class="ambient-glow"></div>

    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="brand">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
            </svg> Lumina
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="nav-link active">Home</a></li>
                    <li><a href="subjects.html" class="nav-link">Subjects</a></li>

                    <li><a href="generate-flashcard.html" class="nav-link">Flashcards</a></li>
                    <li><a href="chat.html" class="nav-link">Lumina</a></li>
                    <li><a href="profile.html" class="nav-link">Profile</a></li>
                </ul>
            </nav>
            <div class="nav-controls">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme" onclick="themeManager.toggle()"></button>
            </div>
        </div>
    </header>

    <main>
        <!-- Header Welcome & Quick Search Trigger -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-xl);" class="reveal">
            <div>
                <h1 style="font-size: 1.8rem; margin-bottom: 4px;">Academic Workspace</h1>
                <p class="subtitle" style="font-size: 0.95rem;">Select a subject to launch context-aware AI query sessions.</p>
            </div>
            <div style="display: flex; gap: var(--space-xs);">
                <a href="chat.html" class="btn btn-primary" style="font-size: 0.85rem;">Open Chat</a>
            </div>
        </div>

        <!-- System Overview Metrics -->
        <div class="reveal" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-md); margin-bottom: var(--space-xl);">
            <!-- Card 1: Vector Database / RAG Index -->
            <div class="card" style="padding: var(--space-md);">
                <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-tertiary); font-weight: 600; letter-spacing: 0.05em; margin-bottom: 6px;">
                    Knowledge Base
                </div>
                <div style="font-size: 1.25rem; font-weight: 600; color: #30d158; display: flex; align-items: center; gap: 8px;">
                    <span style="width: 8px; height: 8px; border-radius: 50%; background: #30d158; display: inline-block;"></span>
                    <span id="subject-count"></span> Subjects Available
                </div>
            </div>

            <!-- Card 2: Core Intelligence Engine -->
            <div class="card" style="padding: var(--space-md);">
                <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-tertiary); font-weight: 600; letter-spacing: 0.05em; margin-bottom: 6px;">
                    AI Assistant
                </div>
                <div style="font-size: 1.25rem; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 8px;">
                    <span style="color: var(--accent-primary);">⚡</span> Gemini 2.5 Flash
                </div>
            </div>
        </div>
        <!-- Quick Subject Launch Grid -->
        <div class="reveal">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-md);">
                <h2 style="font-size: 1.2rem; font-weight: 600;">Active Course Tracks</h2>
                <a href="subjects.html" style="font-size: 0.85rem; color: var(--accent-primary); text-decoration: none; font-weight: 500;">View All →</a>
            </div>

            <div id="recent-subjects-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-md);">
                <!-- Skeleton Loader -->
                <div class="card skeleton" style="height: 100px;"></div>
                <div class="card skeleton" style="height: 100px;"></div>
                <div class="card skeleton" style="height: 100px;"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 Lumina. Built by Zhike Esguerra.</p>
        </div>
    </footer>

    <script src="js/theme.js"></script>
    <script type="module" src="js/toast.js"></script>
    <script src="js/animations.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>

</html>
