<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <!-- Supabase JS Client library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        body {
            background-color: #000000;
            color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        /* Ambient background glow */
        
        .glow-container {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }
        /* Apple-style Frosted Card */
        
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 48px 40px;
            background: rgba(22, 22, 23, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        
        .apple-logo {
            width: 38px;
            height: 38px;
            fill: #f5f5f7;
            margin-bottom: 16px;
        }
        
        h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 8px;
            color: #ffffff;
        }
        
        p.subtitle {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 32px;
            font-weight: 400;
        }
        /* Google OAuth Button */
        
        .btn-google {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #f5f5f7;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        
        .btn-google:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.01);
        }
        
        .btn-google:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .google-icon {
            width: 18px;
            height: 18px;
        }
        
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #6e6e73;
        }
        
        .footer a {
            color: #2997ff;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="glow-container"></div>

    <div class="login-card">
        <!-- Apple Logo SVG -->
        <svg class="apple-logo" viewBox="0 0 170 170" version="1.1">
      <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.34.13-9.13-1.9-14.36-6.08-3.81-3.14-7.84-7.98-12.09-14.52-7.51-11.41-13.25-23.82-17.22-37.23-3.97-13.41-5.95-26.06-5.95-37.95 0-14.9 3.63-27.42 10.89-37.56 7.26-10.14 16.59-15.32 27.99-15.54 4.58 0 9.79 1.16 15.63 3.48 5.84 2.32 9.7 3.59 11.58 3.81 2.39.12 6.42-1.22 12.09-4.02 5.67-2.8 10.83-4.13 15.48-3.98 12.31.62 22.37 5.25 30.19 13.88-10.9 6.53-16.2 15.75-15.9 27.67.31 9.47 4.09 17.38 11.34 23.73 7.25 6.35 15.82 10.02 25.72 11.01-2.39 7.07-5.55 14.18-9.48 21.33zM119.22 31.84c0-7.39 2.72-14.42 8.16-21.09 5.44-6.67 12.18-10.45 20.22-11.34.22 1.09.33 2.07.33 2.94 0 7.28-2.65 14.28-7.95 21.00-5.3 6.72-12.08 10.51-20.35 11.37-.11-.88-.41-1.84-.41-2.88z"/>
    </svg>

        <h1>Sign in with google</h1>
        <p class="subtitle">Use your Google account to continue</p>

        <!-- Google Login Button -->
        <button id="google-login-btn" class="btn-google">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>

        <div class="footer">
            Need help? <a href="#">Contact Support</a>
        </div>
    </div>

    <script>
        // Initialize Supabase Client
        const SUPABASE_URL = 'https://zelmgdfyezdkcvylfkva.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplbG1nZGZ5ZXpka2N2eWxma3ZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NDU0NjAsImV4cCI6MjEwMDEyMTQ2MH0.dJyS4NM4eYaw2GJxkxgDAZg1McCHwj1U61ofQdy4OLk';

        // 2. Access createClient safely from the global window object loaded via CDN
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 3. Update references to use 'supabaseClient'
        document.getElementById('google-login-btn').addEventListener('click', async() => {
            const {
                error
            } = await supabaseClient.auth.signInWithOAuth({
                provider: "google",
                options: {
                    redirectTo: window.location.origin + window.location.pathname
                }
            });

            if (error) {
                console.error("OAuth trigger error:", error.message);
            }
        });

        // 4. Check for active session after redirect
        window.addEventListener('DOMContentLoaded', async() => {
            const {
                data: {
                    session
                }
            } = await supabaseClient.auth.getSession();

            if (session) {
                console.log("Access Token:", session.access_token);

                try {
                    const response = await fetch("http://127.0.0.1:8000/Login", {
                        method: "GET",
                        headers: {
                            Authorization: `Bearer ${session.access_token}`,
                        },
                    });

                    console.log("URL:", response.url);
                    console.log("Status:", response.status);
                    console.log("Response text:", await response.text());

                    if (response.ok) {
                        console.log("Successfully authenticated with FastAPI backend!");
                        // Make sure index.html is relative to your local development server root
                        window.location.href = "index.html";
                    } else {
                        console.error("FastAPI rejected session. Status:", response.status);
                        await supabaseClient.auth.signOut();
                    }
                } catch (err) {
                    console.error("Failed to authenticate with backend:", err);
                }
            }
        });
    </script>
</body>

</html>
