<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards | Lumina</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        /* Minimal Set Deck Card */
        
        .set-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md, 12px);
            padding: var(--space-md) var(--space-lg);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color var(--duration-fast), background-color var(--duration-fast);
        }
        
        .set-card:hover {
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.02);
        }
        
        .set-card-meta {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }
        
        .badge-count {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
        /* Skeleton Loading */
        
        .skeleton-card {
            height: 64px;
            border-radius: var(--radius-md, 12px);
            background: linear-gradient(90deg, var(--bg-secondary) 25%, rgba(255, 255, 255, 0.05) 50%, var(--bg-secondary) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
        
        @keyframes skeleton-loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
        /* Shared Modal Overlay & Popup Styles */
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .modal-container {
            width: 90%;
            max-width: 540px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: var(--space-xl);
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }
        
        .modal-close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            font-size: 1.25rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }
        
        .modal-close-btn:hover {
            color: var(--text-primary);
        }
        /* Upload Modal Specific Styles */
        
        .drop-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-md, 12px);
            padding: var(--space-xl);
            text-align: center;
            background: var(--bg-primary);
            cursor: pointer;
            transition: border-color var(--duration-fast), background-color var(--duration-fast);
        }
        
        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.02);
        }
        /* Progress Bar for Study Modal */
        
        .progress-bar-container {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: var(--accent-primary, #646cff);
            width: 0%;
            transition: width 0.25s ease;
        }
        /* Minimal Flip Card */
        
        .modal-card-wrapper {
            perspective: 1000px;
            height: 260px;
            cursor: pointer;
            width: 100%;
        }
        
        .modal-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        
        .modal-card-wrapper.flipped .modal-card-inner {
            transform: rotateY(180deg);
        }
        
        .modal-card-front,
        .modal-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: var(--radius-md, 12px);
            padding: var(--space-xl);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
        }
        
        .modal-card-back {
            transform: rotateY(180deg);
            border-color: var(--accent-primary);
        }
        
        .modal-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-tag {
            position: absolute;
            top: 14px;
            left: 14px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-tertiary);
            font-weight: 600;
        }
        /* Delete button on set cards */
        
        .delete-set-btn {
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            font-size: 0.9rem;
            line-height: 1;
            transition: color 0.2s, background-color 0.2s;
        }
        
        .delete-set-btn:hover {
            color: #ef4444;
            /* red highlight */
            background: rgba(239, 68, 68, 0.1);
        }
    </style>
</head>

<body>
    <div class="ambient-glow"></div>

    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="brand">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg> Lumina
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="subjects.html" class="nav-link">Subjects</a></li>

                    <li><a href="generate-flashcard.html" class="nav-link active">Flashcards</a></li>
                    <li><a href="chat.html" class="nav-link">Lumina</a></li>
                    <li><a href="profile.html" class="nav-link">Profile</a></li>
                </ul>
            </nav>
            <div class="nav-controls">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme" onclick="themeManager.toggle()"></button>
            </div>
        </div>
    </header>

    <main>
        <!-- Page Header + Action Button -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-xl);" class="reveal">
            <div>
                <h1 style="font-size: 1.8rem; margin-bottom: 4px;">Flashcards</h1>
                <p class="subtitle" style="font-size: 0.95rem;">Review saved decks or create a new set from a document.</p>
            </div>
            <button id="open-create-modal-btn" class="btn btn-primary" style="font-size: 0.85rem;">
                + Create Set
            </button>
        </div>

        <!-- Saved Flashcard Sets -->
        <div id="results-container" class="reveal">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-md);">
                <h2 style="font-size: 1.1rem; font-weight: 600;">Saved Decks</h2>
                <span id="set-count" style="font-size: 0.85rem; color: var(--text-tertiary);"></span>
            </div>

            <div id="sets-grid" style="display: flex; flex-direction: column; gap: var(--space-sm);">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </div>
    </main>

    <!-- 1. Create Flashcards Upload Modal -->
    <div id="create-modal" class="modal-overlay">
        <div class="modal-container">
            <button id="create-modal-close" class="modal-close-btn" aria-label="Close">&times;</button>

            <div>
                <h3 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 2px;">Create Flashcard Set</h3>
                <p style="font-size: 0.85rem; color: var(--text-tertiary);">Upload a document to generate structured study cards.</p>
            </div>

            <form id="flashcard-form" style="display: flex; flex-direction: column; gap: var(--space-md);">
                <div>
                    <label for="title" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px;">Title</label>
                    <input type="text" id="title" name="title" class="input-field" placeholder="e.g., Biology Chapter 4" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
                </div>

                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px;">Document File</label>

                    <label class="drop-zone" id="drop-zone" for="file">
                        <svg viewBox="0 0 24 24" style="width: 28px; height: 28px; fill: var(--text-tertiary); margin-bottom: 6px;">
                            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                        </svg>
                        <span style="font-size: 0.85rem; color: var(--text-secondary);" id="file-label">
                            Drag & drop file or click to browse
                        </span>
                    </label>

                    <input type="file" id="file" name="file" accept=".pdf,.txt,.docx" required style="opacity: 0; position: absolute; width: 0; height: 0; pointer-events: none;">
                </div>

                <div style="display: flex; justify-content: flex-end; gap: var(--space-xs); margin-top: var(--space-xs);">
                    <button type="button" id="create-modal-cancel" class="btn btn-secondary" style="font-size: 0.85rem;">Cancel</button>
                    <button type="submit" id="submit-btn" class="btn btn-primary" style="font-size: 0.85rem;">Generate Set</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. Study Session Modal -->
    <div id="study-modal" class="modal-overlay">
        <div class="modal-container" style="max-width: 600px;">
            <button id="modal-close" class="modal-close-btn" aria-label="Close">&times;</button>

            <div>
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding-right: 24px;">
                    <h3 id="modal-set-title" style="font-size: 1.05rem; font-weight: 600;"></h3>
                    <span id="modal-progress" style="font-size: 0.8rem; color: var(--text-tertiary);"></span>
                </div>
                <div class="progress-bar-container">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>
            </div>

            <!-- Single Flip Flashcard -->
            <div id="modal-card-wrapper" class="modal-card-wrapper">
                <div class="modal-card-inner">
                    <div class="modal-card-front">
                        <span class="card-tag">Front</span>
                        <p id="modal-card-front-text" style="font-size: 1rem; font-weight: 500; text-align: center; line-height: 1.5;"></p>
                    </div>
                    <div class="modal-card-back">
                        <span class="card-tag">Back</span>
                        <p id="modal-card-back-text" style="font-size: 0.95rem; text-align: center; line-height: 1.5;"></p>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="modal-controls">
                <button id="shuffle-btn" class="btn btn-secondary" style="font-size: 0.8rem; padding: 6px 12px;">Shuffle</button>
                <div style="display: flex; gap: var(--space-xs);">
                    <button id="prev-card-btn" class="btn btn-secondary" style="font-size: 0.85rem;">Previous</button>
                    <button id="next-card-btn" class="btn btn-primary" style="font-size: 0.85rem;">Next</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 Lumina. Built by Zhike Esguerra.</p>
        </div>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/animations.js"></script>
    <script type="module" src="js/flashcards.js"></script>
</body>

</html>
